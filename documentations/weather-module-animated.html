<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Module Météo Animé</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        }

        .weather-module {
            width: 450px;
            height: 250px;
            border-radius: 25px;
            position: relative;
            overflow: hidden;
            box-shadow: 0 25px 50px rgba(0, 0, 0, 0.25);
            transition: all 0.8s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .weather-module.day {
            background: linear-gradient(135deg, #87CEEB 0%, #4A90E2 100%);
        }

        .weather-module.night {
            background: linear-gradient(135deg, #1a1a2e 0%, #0f0f1e 100%);
        }

        /* Nuages emoji animés */
        .cloud-emoji {
            position: absolute;
            font-size: 40px;
            opacity: 0.6;
            filter: blur(0.5px);
            user-select: none;
            z-index: 5;
        }

        .cloud-emoji.cloud1 {
            top: 20%;
            left: -100px;
            font-size: 45px;
            animation: cloudFloat1 25s infinite linear;
        }

        .cloud-emoji.cloud2 {
            top: 60%;
            left: -100px;
            font-size: 35px;
            animation: cloudFloat2 30s infinite linear;
            animation-delay: 5s;
        }

        .cloud-emoji.cloud3 {
            top: 40%;
            left: -100px;
            font-size: 50px;
            animation: cloudFloat3 35s infinite linear;
            animation-delay: 10s;
        }

        .cloud-emoji.cloud4 {
            top: 10%;
            left: -100px;
            font-size: 30px;
            animation: cloudFloat4 28s infinite linear;
            animation-delay: 15s;
        }

        .cloud-emoji.cloud5 {
            top: 75%;
            left: -100px;
            font-size: 40px;
            animation: cloudFloat5 32s infinite linear;
            animation-delay: 8s;
        }

        /* Animations des nuages */
        @keyframes cloudFloat1 {
            0% {
                transform: translateX(0) translateY(0);
            }
            25% {
                transform: translateX(150px) translateY(-10px);
            }
            50% {
                transform: translateX(300px) translateY(5px);
            }
            75% {
                transform: translateX(450px) translateY(-5px);
            }
            100% {
                transform: translateX(600px) translateY(0);
            }
        }

        @keyframes cloudFloat2 {
            0% {
                transform: translateX(0) translateY(0) scale(1);
            }
            30% {
                transform: translateX(200px) translateY(10px) scale(1.1);
            }
            60% {
                transform: translateX(350px) translateY(-15px) scale(0.9);
            }
            100% {
                transform: translateX(600px) translateY(0) scale(1);
            }
        }

        @keyframes cloudFloat3 {
            0% {
                transform: translateX(0) translateY(0);
            }
            33% {
                transform: translateX(180px) translateY(15px);
            }
            66% {
                transform: translateX(380px) translateY(-10px);
            }
            100% {
                transform: translateX(600px) translateY(0);
            }
        }

        @keyframes cloudFloat4 {
            0% {
                transform: translateX(0) translateY(0) rotate(0deg);
            }
            50% {
                transform: translateX(300px) translateY(-20px) rotate(10deg);
            }
            100% {
                transform: translateX(600px) translateY(0) rotate(0deg);
            }
        }

        @keyframes cloudFloat5 {
            0% {
                transform: translateX(0) translateY(0);
            }
            40% {
                transform: translateX(250px) translateY(8px);
            }
            100% {
                transform: translateX(600px) translateY(0);
            }
        }

        /* Soleil/Lune animé */
        .celestial-body {
            position: absolute;
            font-size: 60px;
            z-index: 4;
            animation: celestialPulse 4s infinite ease-in-out;
        }

        .celestial-body.sun {
            top: 20px;
            right: 30px;
            animation: sunRotate 20s infinite linear, celestialPulse 4s infinite ease-in-out;
        }

        .celestial-body.moon {
            top: 20px;
            right: 30px;
            animation: moonGlow 3s infinite ease-in-out;
        }

        @keyframes sunRotate {
            0% {
                transform: rotate(0deg);
            }
            100% {
                transform: rotate(360deg);
            }
        }

        @keyframes celestialPulse {
            0%, 100% {
                transform: scale(1);
                filter: brightness(1);
            }
            50% {
                transform: scale(1.1);
                filter: brightness(1.2);
            }
        }

        @keyframes moonGlow {
            0%, 100% {
                transform: scale(1);
                filter: brightness(1) drop-shadow(0 0 20px rgba(255, 255, 255, 0.5));
            }
            50% {
                transform: scale(1.05);
                filter: brightness(1.1) drop-shadow(0 0 30px rgba(255, 255, 255, 0.7));
            }
        }

        /* Étoiles pour la nuit */
        .stars {
            position: absolute;
            width: 100%;
            height: 100%;
            display: none;
        }

        .night .stars {
            display: block;
        }

        .star {
            position: absolute;
            color: white;
            animation: twinkle 3s infinite ease-in-out;
        }

        .star:nth-child(1) { top: 20%; left: 15%; animation-delay: 0s; font-size: 12px; }
        .star:nth-child(2) { top: 30%; left: 40%; animation-delay: 1s; font-size: 10px; }
        .star:nth-child(3) { top: 15%; left: 60%; animation-delay: 2s; font-size: 14px; }
        .star:nth-child(4) { top: 40%; left: 80%; animation-delay: 0.5s; font-size: 11px; }
        .star:nth-child(5) { top: 10%; left: 35%; animation-delay: 1.5s; font-size: 13px; }

        @keyframes twinkle {
            0%, 100% {
                opacity: 0.3;
                transform: scale(1);
            }
            50% {
                opacity: 1;
                transform: scale(1.2);
            }
        }

        /* Particules de pluie occasionnelles */
        .rain-particle {
            position: absolute;
            color: rgba(135, 206, 235, 0.6);
            font-size: 20px;
            animation: rainFall 2s infinite linear;
            z-index: 6;
        }

        .rain-particle:nth-child(1) {
            left: 10%;
            animation-delay: 0s;
            animation-duration: 2.5s;
        }

        .rain-particle:nth-child(2) {
            left: 30%;
            animation-delay: 0.5s;
            animation-duration: 2s;
        }

        .rain-particle:nth-child(3) {
            left: 50%;
            animation-delay: 1s;
            animation-duration: 2.3s;
        }

        @keyframes rainFall {
            0% {
                transform: translateY(-20px);
                opacity: 0;
            }
            10% {
                opacity: 0.6;
            }
            90% {
                opacity: 0.6;
            }
            100% {
                transform: translateY(280px);
                opacity: 0;
            }
        }

        /* Rectangles arrondis flottants de fond */
        .floating-rect {
            position: absolute;
            background: linear-gradient(45deg, rgba(255, 255, 255, 0.03), rgba(255, 255, 255, 0.08));
            border-radius: 20px;
            backdrop-filter: blur(2px);
            z-index: 1;
        }

        .floating-rect:nth-child(1) {
            width: 100px;
            height: 35px;
            bottom: 20%;
            left: 10%;
            animation: floatRect1 20s infinite ease-in-out;
        }

        .floating-rect:nth-child(2) {
            width: 80px;
            height: 25px;
            bottom: 40%;
            right: 20%;
            animation: floatRect2 25s infinite ease-in-out;
            animation-delay: 5s;
        }

        @keyframes floatRect1 {
            0%, 100% {
                transform: translateY(0) translateX(0) rotate(0deg);
                opacity: 0.3;
            }
            50% {
                transform: translateY(-30px) translateX(20px) rotate(10deg);
                opacity: 0.5;
            }
        }

        @keyframes floatRect2 {
            0%, 100% {
                transform: translateY(0) translateX(0) rotate(0deg);
                opacity: 0.2;
            }
            50% {
                transform: translateY(-40px) translateX(-30px) rotate(-10deg);
                opacity: 0.4;
            }
        }

        /* Contenu météo */
        .weather-content {
            position: relative;
            z-index: 10;
            padding: 35px;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            color: white;
            text-shadow: 1px 1px 3px rgba(0, 0, 0, 0.3);
        }

        .header-info {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
        }

        .location {
            font-size: 20px;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .time-indicator {
            font-size: 14px;
            opacity: 0.8;
            font-weight: 500;
        }

        .temperature-container {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin: 20px 0;
        }

        .temp-main {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .temperature {
            font-size: 56px;
            font-weight: 700;
            line-height: 1;
        }

        .temperature sup {
            font-size: 28px;
            margin-left: 2px;
        }

        .weather-icon-main {
            font-size: 60px;
            animation: iconFloat 3s infinite ease-in-out;
        }

        @keyframes iconFloat {
            0%, 100% {
                transform: translateY(0);
            }
            50% {
                transform: translateY(-5px);
            }
        }

        .weather-details {
            display: flex;
            justify-content: space-between;
            align-items: flex-end;
        }

        .feels-like {
            font-size: 15px;
            opacity: 0.9;
        }

        .weather-description {
            font-size: 18px;
            font-weight: 500;
            opacity: 0.95;
        }

        /* Effet de brillance */
        .shine {
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: linear-gradient(45deg, 
                transparent 45%, 
                rgba(255, 255, 255, 0.03) 50%, 
                transparent 55%);
            animation: shine 12s infinite;
            z-index: 2;
        }

        @keyframes shine {
            0% {
                transform: translateX(-100%) translateY(-100%);
            }
            100% {
                transform: translateX(100%) translateY(100%);
            }
        }
    </style>
</head>
<body>
    <div class="weather-module" id="weatherModule">
        <!-- Rectangles de fond -->
        <div class="floating-rect"></div>
        <div class="floating-rect"></div>
        
        <!-- Effet de brillance -->
        <div class="shine"></div>
        
        <!-- Étoiles pour la nuit -->
        <div class="stars">
            <span class="star">✨</span>
            <span class="star">⭐</span>
            <span class="star">✨</span>
            <span class="star">⭐</span>
            <span class="star">✨</span>
        </div>
        
        <!-- Soleil ou Lune -->
        <div class="celestial-body" id="celestialBody">☀️</div>
        
        <!-- Nuages emoji animés -->
        <div class="cloud-emoji cloud1">☁️</div>
        <div class="cloud-emoji cloud2">🌫️</div>
        <div class="cloud-emoji cloud3">☁️</div>
        <div class="cloud-emoji cloud4">⛅</div>
        <div class="cloud-emoji cloud5">☁️</div>
        
        <!-- Particules de pluie optionnelles -->
        <div class="rain-particles" id="rainParticles" style="display: none;">
            <span class="rain-particle">💧</span>
            <span class="rain-particle">💧</span>
            <span class="rain-particle">💧</span>
        </div>
        
        <!-- Contenu météo -->
        <div class="weather-content">
            <div class="header-info">
                <div class="location">
                    📍 Libreville
                </div>
                <div class="time-indicator" id="timeIndicator"></div>
            </div>
            
            <div class="temperature-container">
                <div class="temp-main">
                    <div class="temperature">29<sup>°</sup></div>
                    <div class="weather-icon-main">⛅</div>
                </div>
            </div>
            
            <div class="weather-details">
                <div class="feels-like">Ressenti 30°</div>
                <div class="weather-description">Peu Nuageux</div>
            </div>
        </div>
    </div>

    <script>
        function updateTheme() {
            const now = new Date();
            const hours = now.getHours();
            const minutes = now.getMinutes();
            const weatherModule = document.getElementById('weatherModule');
            const timeIndicator = document.getElementById('timeIndicator');
            const celestialBody = document.getElementById('celestialBody');
            
            // Afficher l'heure actuelle
            timeIndicator.textContent = `${hours.toString().padStart(2, '0')}:${minutes.toString().padStart(2, '0')}`;
            
            // Déterminer si c'est le jour ou la nuit
            const isDay = hours >= 6 && hours < 18;
            
            // Appliquer le thème approprié
            if (isDay) {
                weatherModule.classList.remove('night');
                weatherModule.classList.add('day');
                celestialBody.textContent = '☀️';
                celestialBody.classList.remove('moon');
                celestialBody.classList.add('sun');
            } else {
                weatherModule.classList.remove('day');
                weatherModule.classList.add('night');
                celestialBody.textContent = '🌙';
                celestialBody.classList.remove('sun');
                celestialBody.classList.add('moon');
            }
        }

        // Fonction pour simuler différentes conditions météo
        function randomWeatherEffect() {
            const rainParticles = document.getElementById('rainParticles');
            const random = Math.random();
            
            // 20% de chance d'avoir de la pluie légère
            if (random < 0.2) {
                rainParticles.style.display = 'block';
                setTimeout(() => {
                    rainParticles.style.display = 'none';
                }, 5000);
            }
        }

        // Mise à jour initiale
        updateTheme();
        
        // Mise à jour toutes les minutes
        setInterval(updateTheme, 60000);
        
        // Effet météo aléatoire toutes les 30 secondes
        setInterval(randomWeatherEffect, 30000);

        // Animation au survol
        const weatherModule = document.getElementById('weatherModule');
        weatherModule.addEventListener('mouseenter', () => {
            weatherModule.style.transform = 'scale(1.02) translateY(-5px)';
            weatherModule.style.boxShadow = '0 30px 60px rgba(0, 0, 0, 0.3)';
        });
        
        weatherModule.addEventListener('mouseleave', () => {
            weatherModule.style.transform = 'scale(1) translateY(0)';
            weatherModule.style.boxShadow = '0 25px 50px rgba(0, 0, 0, 0.25)';
        });

        // Ajout d'un effet de parallaxe sur les nuages au mouvement de la souris
        document.addEventListener('mousemove', (e) => {
            const clouds = document.querySelectorAll('.cloud-emoji');
            const x = e.clientX / window.innerWidth;
            const y = e.clientY / window.innerHeight;
            
            clouds.forEach((cloud, index) => {
                const speed = (index + 1) * 2;
                cloud.style.transform = `translate(${x * speed}px, ${y * speed}px)`;
            });
        });
    </script>
</body>
</html>
