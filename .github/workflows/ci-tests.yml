name: 🧪 Tests & Quality

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

jobs:
  # Tests Backend
  backend-tests:
    name: Backend Tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    
    strategy:
      matrix:
        # Backend : Node 22 uniquement, comme en production (Railway, image node:22).
        # openai 7 et puppeteer 25 exigent Node >= 22.
        node-version: [22.x]
    
    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4
      
      - name: 🟢 Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json
      
      - name: 📦 Install dependencies
        working-directory: ./backend
        run: npm ci
      
      # Toute la suite Jest, bloquante, y compris les tests de sécurité (paiement,
      # crédits, gardes d'accès, SSRF). Aucun fichier de test n'est exclu.
      - name: 🧪 Run tests (blocking)
        working-directory: ./backend
        run: npm run test:ci
        env:
          NODE_ENV: test
      
      - name: 📊 Upload coverage
        if: matrix.node-version == '22.x'
        uses: codecov/codecov-action@v4
        with:
          directory: ./backend/coverage
          flags: backend
          fail_ci_if_error: false

  # Tests Frontend
  frontend-tests:
    name: Frontend Tests & Build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    
    strategy:
      matrix:
        # Node 18 retiré : fin de vie, et sharp/nodemailer/supabase-js exigent Node >= 20.
        # Production : Node 22 (Railway) et Node 20 (Netlify).
        node-version: [20.x, 22.x]
    
    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4
      
      - name: 🟢 Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json
      
      - name: 📦 Install dependencies
        working-directory: ./frontend
        run: npm ci
      
      # `next lint` n'a pas de configuration ESLint dans ce projet et s'arrête sur
      # une question interactive. Le contrôle bloquant est la vérification des types.
      - name: 🔍 Type check
        working-directory: ./frontend
        run: npx tsc --noEmit
      
      - name: 🏗️ Build check
        working-directory: ./frontend
        run: npm run build
        env:
          NEXT_PUBLIC_API_URL: http://localhost:3001
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}

  # Lint Backend
  backend-lint:
    name: Backend Linting
    runs-on: ubuntu-latest
    timeout-minutes: 5
    
    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4
      
      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.x'
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json
      
      - name: 📦 Install dependencies
        working-directory: ./backend
        run: npm ci
      
      # Vérification de syntaxe de tous les fichiers JS (bloquante). L'ancien
      # `eslint src/**/*.ts` ne visait aucun fichier : le backend est en JavaScript.
      - name: 🔍 Syntax check
        working-directory: ./backend
        run: npm run lint

  # Security Audit
  security-audit:
    name: Security Audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    
    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4
      
      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'
      
      # Critical = bloquant. Moderate/high : avertissement seulement (à durcir dans M1-5).
      - name: 🔒 Backend Security Audit (critical = blocking)
        working-directory: ./backend
        run: npm audit --audit-level=critical

      # ATTENDU ROUGE tant que `next` reste en 14.x : ses avis critiques ne sont
      # corrigés qu'en Next 16. `if: always()` pour que l'audit frontend s'exécute
      # même si l'audit backend échoue.
      - name: 🔒 Frontend Security Audit (critical = blocking)
        if: always()
        working-directory: ./frontend
        run: npm audit --audit-level=critical

      - name: 🔒 Backend Security Audit (high = report only)
        working-directory: ./backend
        run: npm audit --audit-level=high || echo "::warning::Backend has high-severity npm vulnerabilities"
        continue-on-error: true

      - name: 🔒 Frontend Security Audit (high = report only)
        working-directory: ./frontend
        run: npm audit --audit-level=high || echo "::warning::Frontend has high-severity npm vulnerabilities"
        continue-on-error: true

  # Secret Scanning (gitleaks) — bloque le merge si un secret est détecté
  secret-scan:
    name: Secret Scan (gitleaks)
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      # Binaire gitleaks (gratuit, sans licence — contrairement à l'action v2 pour repos privés).
      # --no-git scanne l'arbre de fichiers ACTUEL (pas l'historique) : bloque les nouveaux
      # secrets sans faire échouer la CI sur les clés déjà présentes dans les anciens commits.
      # Un scan d'historique complet sera fait une fois après la rotation des clés (M1-1).
      - name: 🔎 Run gitleaks (current tree)
        run: |
          GITLEAKS_VERSION=8.21.2
          curl -sSL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" -o gitleaks.tar.gz
          tar -xzf gitleaks.tar.gz gitleaks
          ./gitleaks detect --source . --no-git --redact --verbose --exit-code 1

  # Dependency Check
  dependency-review:
    name: Dependency Review
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    
    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4
      
      - name: 🔍 Dependency Review
        uses: actions/dependency-review-action@v4
        with:
          fail-on-severity: moderate

  # Summary
  tests-summary:
    name: Tests Summary
    runs-on: ubuntu-latest
    needs: [backend-tests, frontend-tests, backend-lint, security-audit]
    if: always()
    
    steps:
      - name: 📊 Check results
        run: |
          echo "═══════════════════════════════════════════════════════════"
          echo "📊 RÉSUMÉ DES TESTS CI/CD"
          echo "═══════════════════════════════════════════════════════════"
          echo ""
          echo "Backend Tests: ${{ needs.backend-tests.result }}"
          echo "Frontend Tests: ${{ needs.frontend-tests.result }}"
          echo "Backend Lint: ${{ needs.backend-lint.result }}"
          echo "Security Audit: ${{ needs.security-audit.result }}"
          echo ""
          
          if [ "${{ needs.backend-tests.result }}" != "success" ] || [ "${{ needs.frontend-tests.result }}" != "success" ] || [ "${{ needs.backend-lint.result }}" != "success" ] || [ "${{ needs.security-audit.result }}" != "success" ]; then
            echo "❌ ÉCHEC: au moins un contrôle n'a pas réussi"
            exit 1
          else
            echo "✅ SUCCÈS: Tous les tests ont réussi"
          fi
